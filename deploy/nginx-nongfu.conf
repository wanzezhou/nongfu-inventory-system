# ============================================================================
# nginx 站点配置 —— 农夫山泉经销商进销存系统
# 放置位置：/etc/nginx/sites-available/nongfu
#           然后：ln -s /etc/nginx/sites-available/nongfu /etc/nginx/sites-enabled/nongfu
# 生效：    nginx -t && systemctl reload nginx
#
# ⚠️ 只需改一处：下面的 server_name（填你的域名或服务器公网 IP）
# ⚠️ 四条 location 缺一不可：
#      /                    → 前端静态文件 + history 路由回退
#      /api/                → 后端接口
#      /product_images/     → 商品图片（后端静态目录，位于仓库根「商品档案/商品图片」）
#      /uploads/            → 上传文件（后端带来源白名单守卫）
# ============================================================================

server {
    listen 80;
    listen [::]:80;

    # ⚠️ 改这里：有域名填域名，没有就先填服务器公网 IP
    server_name your-domain.com;

    # 前端构建产物（在服务器上执行 frontend/ 的 npm run build 后生成）
    root /opt/nongfu/frontend/dist;
    index index.html;

    # 后端单文件上传上限是 5MB（multer），这里给到 10m 留余量
    # ⚠️ nginx 默认只有 1m，不调大上传 Excel / 商品图会直接报 413
    client_max_body_size 10m;

    # 字符集
    charset utf-8;

    # 访问日志
    access_log /var/log/nginx/nongfu.access.log;
    error_log  /var/log/nginx/nongfu.error.log;

    # ---------- ① 前端：history 路由必须回退到 index.html ----------
    # 前端用的是 createWebHistory()，直接访问 /orders 这类路径时磁盘上没有该文件，
    # 必须回退给 index.html 由前端路由处理，否则「刷新页面就 404」。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带 hash，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ---------- ② 后端接口 ----------
    # ⚠️ proxy_pass 结尾**不要**加斜杠：加了会剥掉 /api 前缀，后端全线 404
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端用 req.protocol 拼图片地址，必须透传协议，否则 HTTPS 页面会拼出 http://
        proxy_set_header X-Forwarded-Proto $scheme;

        # Excel 导入 / 统计导出可能较慢，默认 60s 容易 504
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ---------- ③ 商品图片（最容易被漏掉的一条）----------
    # 后端挂载点 /product_images 指向 <仓库根>/商品档案/商品图片，
    # 前端页面用的是站内相对路径 /product_images/xxx.png —— 不反代就全站裂图。
    location /product_images/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 7d;
    }

    # ---------- ④ 上传文件（配送照片 / 报销凭证）----------
    # ⚠️ 后端 app.js 的 guardUploads 会校验 Referer / Origin 是否在 CORS 白名单内，
    #    因此这两个头**必须原样透传**，否则一律 403。
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin            $http_origin;
        proxy_set_header Referer           $http_referer;
    }

    # ---------- ⑤ 健康检查（可选：便于云监控拨测，不经过 Node 限流）----------
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ============================================================================
# 启用 HTTPS 后，certbot 会自动改写本文件（追加 443 server 块与 80→443 跳转）。
# 届时记得同步修改 backend/.env 的 CORS_ORIGIN 为 https:// 地址，并重启后端：
#     pm2 restart nongfu-api
# 另外需让后端信任代理头（否则拼出的图片地址仍是 http://）：
#     在 backend/src/app.js 的 const app = express(); 之后加 app.set('trust proxy', 1);
# ============================================================================
