# 代码审查门禁（G2 机器门禁 · 全量部分）
# =====================================================================
# 配套：docs/代码审查标准.md、docs/代码审查流程.md 第四章
#
# 设计原则：
#   1. 红线扫描只判「本次改动新增的行」——存量为基线、新增违规即阻断，
#      这样闸门从第一天就可执行，且存量不会因新代码加入而变差（棘轮效应）
#   2. 冒烟脚本依赖 MySQL，不进 CI（由作者在 PR 中提供输出证据）
#   3. 各 job 在依赖未安装时优雅跳过并给出提示，避免门禁一上线即全红被关闭
name: Code Review Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── 红线扫描：项目史踩过的坑，只判新增代码 ──────────────────────
  hazard-scan:
    name: 红线扫描（新增代码）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 增量红线扫描
        run: |
          set -e
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          echo "对比基线：$BASE"
          node scripts/check-diff-hazards.mjs --base "$BASE"

      - name: 全仓基线统计（仅记录，不阻断）
        if: always()
        run: node scripts/check-diff-hazards.mjs --all >> "$GITHUB_STEP_SUMMARY" || true

  # ── 改动规模与范围守卫 ──────────────────────────────────────────
  diff-guard:
    name: 改动规模与范围守卫
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 检查改动规模
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          STATS=$(git diff --shortstat "$BASE"...HEAD)
          echo "改动统计：$STATS"
          CHANGED=$(git diff --numstat "$BASE"...HEAD | awk '{a+=$1; d+=$2} END {print a+d}')
          echo "总变动行数：${CHANGED:-0}"
          {
            echo "### 改动规模"
            echo ""
            echo "$STATS"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${CHANGED:-0}" -gt 800 ]; then
            echo "::warning::本次改动 ${CHANGED} 行，超过 800 行。AI 生成的改动应小步提交，建议拆分（见 docs/代码审查流程.md 3.1）。"
          fi

      - name: 检查是否改动了禁止提交项
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE"...HEAD)
          FAIL=0
          for p in ".env" "backend/.env" "backend/uploads/" "商品档案/"; do
            if echo "$CHANGED_FILES" | grep -q "^${p}"; then
              echo "::error::禁止提交敏感路径：$p"
              FAIL=1
            fi
          done
          if echo "$CHANGED_FILES" | grep -qE "^database/backup_.*\.sql$"; then
            echo "::error::禁止提交数据库备份（含真实业务数据）"
            FAIL=1
          fi
          if echo "$CHANGED_FILES" | grep -qE "^backend/.*\.(log|pid)$" ; then
            echo "::error::禁止提交日志/pid 文件"
            FAIL=1
          fi
          exit $FAIL

  # ── 仓库原有静态门禁 ─────────────────────────────────────────────
  # 依赖分两类，务必区分：
  #   · check_frontend_tokens.js —— 零依赖（只用 node:fs / node:path），任何环境可跑
  #   · check-script-refs.mjs   —— 需要 @vue/compiler-sfc 解析 SFC，必须装前端依赖
  # 2026-09-18 修复：本 job 此前**从不安装前端依赖**，引用检查以 MODULE_NOT_FOUND
  # 堆栈失败 —— 即该 job 自上线起永远不可能变绿（第一次真实运行就暴露了）。
  static-gates:
    name: 静态门禁（引用检查 / 视觉 token）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # 先跑零依赖项：这样即使下面的依赖安装出问题，也能看到它的独立结论
      - name: 视觉 token 门禁（禁止硬编码色值，零依赖）
        run: node backend/scripts/check_frontend_tokens.js

      - name: 安装前端依赖（引用检查需要 @vue/compiler-sfc）
        working-directory: frontend
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 前端未声明引用检查
        run: node frontend/scripts/check-script-refs.mjs

  # ── ESLint + Prettier（需根目录已安装工具链，见 docs/代码审查流程.md 第八章）──
  lint:
    name: ESLint / Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # ⚠️ cache: npm 要求根目录存在 lock 文件；缺失时 setup-node 直接报
      #    「Dependencies lock file is not found」——2026-09-18 就是这么红的。
      #    故此处先做存在性判定并给出可执行提示，而非让它以缓存错误的形式失败。
      - name: 校验工具链是否已就绪
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "::error::根目录缺 package.json。请按 docs/代码审查流程.md 第八章安装工具链（npm init + npm i -D ...）。"
            echo "SKIP_LINT=1" >> "$GITHUB_ENV"
          elif [ ! -f package-lock.json ]; then
            echo "::error::根目录缺 package-lock.json（cache: npm 依赖它）。请在根目录执行 npm install 后提交 lock 文件。"
            echo "SKIP_LINT=1" >> "$GITHUB_ENV"
          fi

      - name: 安装工具链依赖
        if: env.SKIP_LINT != '1'
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: ESLint
        if: env.SKIP_LINT != '1'
        # --max-warnings 是「棘轮」：2026-09-18 基线为 33 个 warning，阈值设 40。
        # 存量不再增长，且每次收紧都必须在 docs/项目概览.md 记录新基线。
        run: npx eslint . --max-warnings 40

      - name: Prettier 格式检查（仅记录，不阻断）
        if: env.SKIP_LINT != '1'
        run: |
          # 2026-09-18 基线：193 个文件与 prettier 风格不一致。
          # 为什么不在 CI 里全仓 --write：那会产生覆盖 193 文件的巨型 diff，
          # 把真实缺陷淹没（这正是本流程文档反复强调的失败模式）。
          # 策略改为「棘轮」——新代码/改动过的文件由 pre-commit 的 lint-staged
          # 就地格式化，存量文件在下次被改动时自动归位。
          npx prettier --check . 2>&1 | tail -30 || true
          echo "::notice::Prettier 仅记录不阻断。存量基线 193 文件；改动文件由 pre-commit 的 lint-staged 就地格式化。"

  # ── 前端构建（防止语法/导入错误进主干）──────────────────────────
  build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装前端依赖
        working-directory: frontend
        env:
          HUSKY: '0'
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 构建
        working-directory: frontend
        run: node node_modules/vite/bin/vite.js build
